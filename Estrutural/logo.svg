<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pillarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E75B6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fundo arredondado -->
  <rect width="256" height="256" rx="32" fill="#F8F9FA"/>
  
  <!-- Círculo de destaque -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#E8EAED" stroke-width="2"/>
  
  <!-- Estrutura principal -->
  <g filter="url(#shadow)">
    <!-- Pilares esquerdo e direito -->
    <rect x="40" y="60" width="12" height="150" rx="2" fill="url(#pillarGradient)" stroke="#1F4E78" stroke-width="1"/>
    <rect x="204" y="60" width="12" height="150" rx="2" fill="url(#pillarGradient)" stroke="#1F4E78" stroke-width="1"/>
    
    <!-- Vigas horizontais -->
    <rect x="40" y="70" width="176" height="8" rx="2" fill="url(#beamGradient)" stroke="#8B2E1F" stroke-width="1"/>
    <rect x="40" y="155" width="176" height="8" rx="2" fill="url(#beamGradient)" stroke="#8B2E1F" stroke-width="1"/>
    
    <!-- Vigas verticais internas -->
    <rect x="100" y="70" width="8" height="85" rx="2" fill="#95A5A6" stroke="#34495E" stroke-width="0.5" opacity="0.7"/>
    <rect x="148" y="70" width="8" height="85" rx="2" fill="#95A5A6" stroke="#34495E" stroke-width="0.5" opacity="0.7"/>
    
    <!-- Seção de pilares (representação de seção) -->
    <g transform="translate(128, 110)">
      <!-- Quadrado representando seção -->
      <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="#27AE60" stroke-width="2" rx="2"/>
      
      <!-- Divisões internas -->
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#27AE60" stroke-width="0.5" opacity="0.5"/>
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#27AE60" stroke-width="0.5" opacity="0.5"/>
      
      <!-- Marcas de dimensão -->
      <circle cx="-18" cy="-15" r="2" fill="none" stroke="#F39C12" stroke-width="1"/>
      <circle cx="-18" cy="15" r="2" fill="none" stroke="#F39C12" stroke-width="1"/>
      <line x1="-20" y1="-15" x2="-20" y2="15" stroke="#F39C12" stroke-width="1"/>
      <line x1="-22" y1="-15" x2="-18" y2="-15" stroke="#F39C12" stroke-width="1"/>
      <line x1="-22" y1="15" x2="-18" y2="15" stroke="#F39C12" stroke-width="1"/>
      
      <!-- Texto "IFC" -->
      <text x="0" y="4" font-size="10" font-weight="bold" text-anchor="middle" fill="#2E75B6" font-family="Arial, sans-serif">IFC</text>
    </g>
  </g>
  
  <!-- Título inferior -->
  <text x="128" y="235" font-size="18" font-weight="bold" text-anchor="middle" fill="#2E75B6" font-family="Arial, sans-serif">IFC Estrutural</text>
  
  <!-- Descrição -->
  <text x="128" y="250" font-size="10" text-anchor="middle" fill="#7F8C8D" font-family="Arial, sans-serif">Import Estrutural</text>
</svg>
