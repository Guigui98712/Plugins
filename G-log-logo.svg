<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fundo circular com gradiente -->
  <circle cx="128" cy="128" r="128" fill="url(#gGradient)"/>
  
  <!-- Anel externo -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
  
  <!-- Letra "G" estilizada -->
  <g filter="url(#glow)">
    <!-- Arco externo -->
    <path d="M 100 80 A 48 48 0 0 0 100 176" fill="none" stroke="white" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Linha horizontal interna -->
    <line x1="120" y1="135" x2="155" y2="135" stroke="white" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Ponto de destaque -->
    <circle cx="155" cy="135" r="8" fill="white"/>
  </g>
  
  <!-- Subtítulo -->
  <text x="128" y="220" font-size="20" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">G-log</text>
  
  <!-- Descrição adicional -->
  <text x="128" y="242" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif">Plugin Suite</text>
</svg>
